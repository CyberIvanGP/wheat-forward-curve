[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheat-curve-calculator"
version = "1.3.0"
description = "Standalone Decimal EOD wheat forward curve calculator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
images = ["Pillow==12.3.0"]
margin = ["numpy==2.5.4", "scipy==1.18.1"]

[tool.setuptools.packages.find]
include = ["wheat_curve*", "interest_rate_curve*", "financial_contracts*", "guarantee_collateral*", "project_parameters*", "calculation_run*", "test", "generator"]

[tool.setuptools.package-data]
project_parameters = ["*.json"]
generator = ["*.json"]
